plugins {
    id 'base'
}

tasks.register('native2ascii') {
    group = 'i18n'
    description = 'Rewrites all *.properties files in this directory tree using Ant native2ascii'

    def propertiesRoot = layout.projectDirectory
    def tempDir = layout.buildDirectory.dir('native2ascii')

    inputs.files(propertiesRoot.asFileTree.matching { include '**/*.properties' })
    outputs.files(propertiesRoot.asFileTree.matching { include '**/*.properties' })

    doLast {
        def scratch = tempDir.get().asFile
        scratch.mkdirs()

        ant.native2ascii(
            encoding: 'UTF-8',
            src: propertiesRoot.asFile,
            dest: scratch,
            includes: '**/*.properties'
        )

        copy {
            from scratch
            include '**/*.properties'
            into propertiesRoot.asFile
        }
    }
}
